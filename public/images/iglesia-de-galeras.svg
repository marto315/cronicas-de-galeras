<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Silueta de la iglesia de Galeras">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e3c6"/>
      <stop offset="1" stop-color="#e7d3ac"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2623b"/>
      <stop offset="1" stop-color="#8a4a2b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="960" cy="150" r="70" fill="#f7f0dd" opacity="0.85"/>
  <circle cx="960" cy="150" r="58" fill="#ffffff" opacity="0.6"/>
  <rect width="1200" height="150" y="480" fill="url(#ground)" opacity="0.28"/>
  <path d="M0 480 L600 360 L1200 480 L1200 630 L0 630 Z" fill="#b45a35"/>
  <g fill="#7a4226">
    <!-- cross top -->
    <rect x="586" y="120" width="8" height="46" rx="2"/><rect x="570" y="132" width="50" height="8" rx="2"/>
    <!-- bell tower / facade -->
    <path d="M340 480 L600 170 L600 120 L860 120 L860 170 L600 170 L860 480 Z" fill="#9a4e2c"/>
    <rect x="600" y="80" width="120" height="90" fill="#9a4e2c"/>
    <rect x="612" y="100" width="44" height="44" rx="4" fill="#f2e3c6"/><rect x="668" y="100" width="44" height="44" rx="4" fill="#f2e3c6"/>
    <rect x="606" y="150" width="12" height="12" fill="#f2e3c6"/><rect x="662" y="150" width="12" height="12" fill="#f2e3c6"/>
    <!-- nave -->
    <rect x="360" y="300" width="480" height="180" fill="#d9774a"/>
    <rect x="370" y="320" width="120" height="160" fill="#f3e7cd"/>
    <rect x="520" y="320" width="160" height="160" fill="#e7d3ac"/>
    <rect x="716" y="320" width="120" height="160" fill="#f3e7cd"/>
    <!-- roof -->
    <path d="M300 300 L600 170 L900 300 Z" fill="#7a4226"/>
  </g>
  <rect x="0" y="486" width="1200" height="144" fill="#8a4a2b"/>
</svg>